name: 打包Windows应用


on:
  push:
    branches: [ main ]  # 当推送到main分支时触发
  pull_request:
    branches: [ main ]  # 当创建针对main分支的PR时触发
  workflow_dispatch:    # 允许手动触发工作流

jobs:
  build:
    runs-on: windows-latest  # 在Windows环境中运行

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整的git历史用于版本号生成

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # 指定Python版本
        cache: 'pip'  # 启用pip缓存

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
        if exist requirements.txt pip install -r requirements.txt

    - name: 安装tkinterdnd2
      run: |
        pip install tkinterdnd2

    - name: 打包应用程序
      run: |
        pyinstaller --onefile --windowed --name "图像拼接工具" " main.py

    - name: 上传构建产物
      uses: actions/upload-artifact@v4  # 更新到v4版本
      with:
        name: 图像拼接工具
        path: dist/  # PyInstaller默认输出路径

    - name: 创建Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')  # 只在有标签的提交上创建Release
      with:
        files: |
          dist/图像拼接工具.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}